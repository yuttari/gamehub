<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <!-- dusk sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16335f"/>
      <stop offset="0.55" stop-color="#2b5fa0"/>
      <stop offset="1" stop-color="#6f9fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20262f"/>
      <stop offset="0.45" stop-color="#566273"/>
      <stop offset="0.55" stop-color="#6f7d8f"/>
      <stop offset="1" stop-color="#2b323c"/>
    </linearGradient>
    <linearGradient id="afterburner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.4" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="o"/>
      <feFlood flood-color="black" flood-opacity="0.35"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#sky)"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <!-- distant haze clouds -->
  <g fill="rgba(255,255,255,0.10)">
    <ellipse cx="80" cy="70" rx="70" ry="14"/>
    <ellipse cx="330" cy="120" rx="90" ry="16"/>
    <ellipse cx="160" cy="250" rx="120" ry="18"/>
  </g>

  <!-- realistic military jet, side profile, nose to the right -->
  <g filter="url(#sh)" transform="translate(195,150)">
    <!-- afterburner plume -->
    <path d="M -88 0 L -150 -7 Q -168 0 -150 7 Z" fill="url(#afterburner)"/>
    <path d="M -88 0 L -128 -3 Q -138 0 -128 3 Z" fill="#fff7d6"/>
    <!-- swept wings (top) -->
    <path d="M -8 -10 L 36 -54 L 60 -52 L 18 -6 Z" fill="#3a4250"/>
    <path d="M -8 10 L 36 54 L 60 52 L 18 6 Z" fill="#2c333e"/>
    <!-- tail fin -->
    <path d="M -66 -6 L -90 -34 L -64 -16 Z" fill="#444c5a"/>
    <!-- fuselage -->
    <path d="M 95 0 L 60 -14 L -40 -16 L -86 -7 L -88 0 L -86 7 L -40 16 L 60 14 Z" fill="url(#steel)"/>
    <!-- panel lines -->
    <path d="M 50 -12 L 50 12 M 10 -14 L 10 14 M -30 -15 L -30 15" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
    <!-- canopy -->
    <path d="M 52 -9 Q 70 -15 82 -6 L 70 2 Q 58 -3 52 -9 Z" fill="#7fd9ff"/>
    <path d="M 56 -8 Q 68 -12 78 -6 L 70 0 Q 62 -4 56 -8 Z" fill="#cdefff" opacity="0.9"/>
    <!-- intake -->
    <ellipse cx="-44" cy="6" rx="9" ry="6" fill="#11151b"/>
    <!-- nose accent -->
    <circle cx="88" cy="0" r="3.5" fill="#ff4d4d"/>
    <!-- missile under wing -->
    <rect x="2" y="34" width="26" height="5" rx="2.5" fill="#cfd6df"/>
    <polygon points="28,34 36,36.5 28,39" fill="#cfd6df"/>
  </g>

  <!-- title capsule -->
  <rect x="78" y="246" width="244" height="42" rx="21" fill="rgba(12,18,28,.82)"/>
  <text x="200" y="273" font-size="20" font-weight="900" fill="#fff" text-anchor="middle"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif" letter-spacing="2">PLANE WAR</text>
</svg>
