<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Makeup Table</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #ffe9f2; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  .wrap { display: flex; height: 100%; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas { background: transparent; max-height: 100%; touch-action: none; }
  .panel { width: 230px; background: #fff; box-shadow: -4px 0 20px rgba(255,140,180,.2); padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .panel h2 { font-size: 16px; color: #d6336c; margin-bottom: 2px; }
  .cat { font-size: 12px; font-weight: 800; color: #9c5; color:#b85c8a; margin-top: 4px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.15); cursor: pointer; transition: transform .12s; }
  .sw:hover { transform: scale(1.12); }
  .sw.active { border-color: #ff4d8d; transform: scale(1.12); }
  .reset { margin-top: auto; padding: 12px; border: none; border-radius: 14px; background: #ffd6e7; color: #c2255c; font-weight: 800; cursor: pointer; }
  .reset:active { transform: scale(.97); }
  .title { position: absolute; top: 12px; left: 16px; font-size: 20px; font-weight: 900; color: #ff5d8f; text-shadow: 0 2px 6px rgba(255,255,255,.8); }
  @media (max-width: 560px){ .panel{ width: 150px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="title">💄 Makeup Table</div>
    <canvas id="face" width="420" height="560"></canvas>
  </div>
  <div class="panel">
    <h2>Pick a feature to apply makeup 👇</h2>
    <div class="cat">💋 Lipstick</div>
    <div class="swatches" id="lip"></div>
    <div class="cat">👁️ Eyeshadow</div>
    <div class="swatches" id="eye"></div>
    <div class="cat">🌸 Blush</div>
    <div class="swatches" id="blush"></div>
    <div class="cat">💅 Nails</div>
    <div class="swatches" id="nail"></div>
    <div class="cat">💇 Hair</div>
    <div class="swatches" id="hair"></div>
    <button class="reset" id="reset">🧼 Reset & Remove</button>
  </div>
</div>
<script>
(function(){
  const cv = document.getElementById('face');
  const ctx = cv.getContext('2d');
  const state = {
    lip: '#e84a5f', eye: null, blush: null, nail: '#ff7eb3', hair: 0
  };
  const LIPS = ['#e84a5f','#ff6b81','#c0392b','#ff9ff3','#a55eea','#ff4757','#ffa502'];
  const EYES = ['#6c5ce7','#0984e3','#00b894','#e17055','#fdcb6e','#fd79a8'];
  const BLUSH = ['#ff8fab','#ffb3c6','#ff6b9d','#f783ac'];
  const NAILS = ['#ff7eb3','#ffd6e7','#a0e7e5','#b4f8c8','#fbe7c6','#ffaebc'];
  const HAIRS = ['#3d2b1f','#1a1a1a','#6b3e26','#a0522d','#d4a017','#b5651d','#5d4037'];

  function build(id, arr, key){
    const box = document.getElementById(id);
    arr.forEach((c,i)=>{
      const d = document.createElement('div');
      d.className='sw'+(state[key]===c?' active':'');
      d.style.background=c;
      d.onclick=()=>{ state[key]=c; mark(box,d); draw(); };
      box.appendChild(d);
    });
  }
  function mark(box, el){ [...box.children].forEach(c=>c.classList.remove('active')); el.classList.add('active'); }
  build('lip',LIPS,'lip'); build('eye',EYES,'eye'); build('blush',BLUSH,'blush');
  build('nail',NAILS,'nail');
  const hairBox=document.getElementById('hair');
  HAIRS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='sw'; d.style.background=c;
    d.onclick=()=>{ state.hair=i; mark(hairBox,d); draw(); }; hairBox.appendChild(d); });

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    const cx=cv.width/2;
    // hair back
    ctx.fillStyle=HAIRS[state.hair];
    ctx.beginPath(); ctx.ellipse(cx,230,150,190,0,0,6.28); ctx.fill();
    // neck
    ctx.fillStyle='#ffe0c8'; ctx.fillRect(cx-30,360,60,80);
    // face
    const fg=ctx.createLinearGradient(cx,80,cx,400); fg.addColorStop(0,'#fff1e6'); fg.addColorStop(1,'#ffe0c8');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.ellipse(cx,230,118,150,0,0,6.28); ctx.fill();
    // bangs / front hair
    ctx.fillStyle=HAIRS[state.hair];
    ctx.beginPath(); ctx.moveTo(cx-118,200);
    ctx.quadraticCurveTo(cx-120,90,cx,80);
    ctx.quadraticCurveTo(cx+120,90,cx+118,200);
    ctx.quadraticCurveTo(cx+60,150,cx,160);
    ctx.quadraticCurveTo(cx-60,150,cx-118,200);
    ctx.fill();
    // blush
    if(state.blush){
      ctx.globalAlpha=0.55; ctx.fillStyle=state.blush;
      ctx.beginPath(); ctx.ellipse(cx-62,265,26,16,0,0,6.28); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+62,265,26,16,0,0,6.28); ctx.fill();
      ctx.globalAlpha=1;
    }
    // eyes
    ctx.fillStyle='#3a2a22';
    [-42,42].forEach(dx=>{ ctx.beginPath(); ctx.ellipse(cx+dx,215,16,11,0,0,6.28); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+dx+4,212,4,0,6.28); ctx.fill(); ctx.fillStyle='#3a2a22'; });
    // eyebrows
    ctx.strokeStyle='#5a4032'; ctx.lineWidth=4; ctx.lineCap='round';
    [-42,42].forEach(dx=>{ ctx.beginPath(); ctx.moveTo(cx+dx-16,190); ctx.quadraticCurveTo(cx+dx,182,cx+dx+16,190); ctx.stroke(); });
    // eyeshadow
    if(state.eye){
      ctx.globalAlpha=0.7; ctx.fillStyle=state.eye;
      [-42,42].forEach(dx=>{ ctx.beginPath(); ctx.ellipse(cx+dx,202,18,9,0,0,6.28); ctx.fill(); });
      ctx.globalAlpha=1;
    }
    // nose
    ctx.strokeStyle='#e8b89a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx,235); ctx.quadraticCurveTo(cx-8,255,cx,262); ctx.stroke();
    // lips
    ctx.fillStyle=state.lip;
    ctx.beginPath(); ctx.moveTo(cx-30,300);
    ctx.quadraticCurveTo(cx,290,cx+30,300);
    ctx.quadraticCurveTo(cx,322,cx-30,300); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(cx,303,10,4,0,0,6.28); ctx.fill();
    // nails (fingers)
    ctx.fillStyle=state.nail;
    [ -1,1].forEach(s=>{
      for(let i=0;i<4;i++){
        ctx.beginPath(); ctx.roundRect(cx + s*(70+i*0) , 430 + i*0, 0,0,0); // placeholder noop
      }
    });
    // simple nail strips at bottom
    ctx.fillStyle=state.nail;
    for(let i=0;i<5;i++){
      ctx.beginPath(); ctx.roundRect(cx-70+i*30, 470, 18, 34, 6); ctx.fill();
    }
    for(let i=0;i<5;i++){
      ctx.beginPath(); ctx.roundRect(cx-30+i*30, 510, 18, 34, 6); ctx.fill();
    }
  }
  document.getElementById('reset').onclick=()=>{ state.lip='#e84a5f'; state.eye=null; state.blush=null; state.nail='#ff7eb3'; state.hair=0;
    build('lip',LIPS,'lip'); build('eye',EYES,'eye'); build('blush',BLUSH,'blush'); build('nail',NAILS,'nail');
    hairBox.innerHTML=''; HAIRS.forEach((c,i)=>{ const d=document.createElement('div'); d.className='sw'; d.style.background=c;
      d.onclick=()=>{ state.hair=i; mark(hairBox,d); draw(); }; hairBox.appendChild(d); });
    draw();
  };
  draw();
})();
</script>
</body>
</html>
