<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Fighter</title>
<style>
* {box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:none;}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% 0%,#1e2d52 0%,#0d0f1a 70%,#05060a 100%);color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.wrap{width:100%;height:100%;max-width:1200px;display:flex;flex-direction:column;padding:12px 16px;}
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
h1{font-size:22px;font-weight:900;text-shadow:0 0 12px rgba(100,180,255,.6);}
.pills{display:flex;gap:10px;align-items:center;}
.pill{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;}
.pill b{color:#ffd23f;}
.lives{display:flex;gap:4px;align-items:center;}
.life{width:14px;height:14px;border-radius:50%;background:linear-gradient(145deg,#ff5e7a,#ff2a4d);box-shadow:0 0 8px #ff2a4d;transition:transform .15s,opacity .15s;}
.life.lost{transform:scale(.2);opacity:.15;box-shadow:none;background:#444;}
.stage{flex:1 1 auto;position:relative;width:100%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:18px;overflow:hidden;box-shadow:inset 0 0 60px rgba(80,140,255,.05);}
canvas{display:block;width:100%;height:100%;}
.overlay{position:absolute;inset:0;background:rgba(5,6,10,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.show{opacity:1;pointer-events:auto;}
.overlay h2{font-size:32px;font-weight:900;}
.overlay p{opacity:.75;font-size:14px;max-width:360px;text-align:center;line-height:1.5;}
.btn{background:linear-gradient(145deg,#ffd23f,#ff9f1c);color:#16131a;border:none;border-radius:12px;padding:13px 30px;font-weight:900;font-size:16px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🚀 Sky Fighter</h1>
    <div class="pills">
      <div class="pill">Score <b id="score">0</b></div>
      <div class="pill">Level <b id="level">1</b></div>
      <div class="pill lives" id="lives"></div>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="ovTitle">Sky Fighter</h2>
      <p id="ovText">PC: Mouse / Arrows　·　Mobile: Swipe</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>
</div>
<script>
(function(){
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
const LOGIC_W=960, LOGIC_H=540;
let scale=1, W=LOGIC_W, H=LOGIC_H;
function resize(){
  const rect=stage.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.floor(rect.width*dpr));
  cv.height=Math.max(1,Math.floor(rect.height*dpr));
  scale=cv.width/LOGIC_W;
}
function draw(){
  ctx.save();
  ctx.setTransform(scale,0,0,scale,0,0);   // CRITICAL: scales 960x540 logical space to fill the canvas
  // draw everything in 0..960 x 0..540 coordinates
  ctx.restore();
}
window.addEventListener('resize',()=>{resize(); if(!running)draw();});

// ---------- AUDIO ----------
let AC=null, master=null;
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0.35; master.connect(AC.destination);
  }catch(e){ AC=null; }
}
function tone(freq,dur,type,vol,slide){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,slide), AC.currentTime+dur);
  g.gain.value=vol||0.2;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(master);
  o.start(); o.stop(AC.currentTime+dur);
}
function noise(dur,vol){
  if(!AC) return;
  const n=AC.createBufferSource();
  const b=AC.createBuffer(1, Math.floor(AC.sampleRate*dur), AC.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  n.buffer=b;
  const g=AC.createGain(); g.gain.value=vol||0.3;
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1200;
  n.connect(f); f.connect(g); g.connect(master);
  n.start(); n.stop(AC.currentTime+dur);
}
function sFire(){ tone(880,0.08,'square',0.12,420); }
function sBoom(){ noise(0.35,0.4); tone(120,0.35,'sawtooth',0.18,40); }
function sPick(){ tone(660,0.1,'triangle',0.2,990); tone(990,0.12,'triangle',0.15,1320); }
function sHit(){ tone(90,0.3,'sawtooth',0.3,40); }
function sLevel(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.18,'triangle',0.2),i*90)); }

// ---------- STATE ----------
let running=false, score=0, level=1, lives=3, spawnTimer=0, killQuota=0, killed=0;
let player, bullets, enemies, parts, floats, pickups, ebullets, boss=null;
let invuln=0, shake=0, scrollFar=0, scrollMid=0, scrollNear=0;
let pointer={x:LOGIC_W*0.2,y:LOGIC_H*0.5};
let inputKey={up:false,down:false,left:false,right:false};
let lvlBanner=0;

const elScore=document.getElementById('score');
const elLevel=document.getElementById('level');
const elLives=document.getElementById('lives');
const elOverlay=document.getElementById('overlay');
const elOvTitle=document.getElementById('ovTitle');
const elOvText=document.getElementById('ovText');

function buildLives(){
  elLives.innerHTML='';
  for(let i=0;i<3;i++){
    const d=document.createElement('div');
    d.className='life'+(i>=lives?' lost':'');
    elLives.appendChild(d);
  }
}

// ---------- LEVEL ----------
function levelConfig(lv){
  const isBoss = (lv%4===0);
  return {
    isBoss,
    spawnInterval: Math.max(28, 70 - lv*5),   // frames between spawns (shorter = harder)
    enemySpeed: 1.6 + lv*0.25,
    quota: isBoss ? 1 : (8 + lv*3),
    bossHP: 60 + lv*25
  };
}

// ---------- ENTITIES ----------
function resetGame(){
  score=0; level=1; lives=3; killed=0; invuln=0; shake=0; boss=null;
  bullets=[]; enemies=[]; parts=[]; floats=[]; pickups=[]; ebullets=[];
  player={x:LOGIC_W*0.2,y:LOGIC_H*0.5,vx:0,vy:0,w:46,h:30,spread:0,spreadT:0,shield:0,shieldT:0,fireCd:0,trail:[]};
  const c=levelConfig(level); killQuota=c.quota; spawnTimer=60;
  buildLives(); updateHUD();
}
function updateHUD(){
  elScore.textContent=score; elLevel.textContent=level; buildLives();
}

function addFloat(x,y,text,color){
  floats.push({x,y,text,color:color||'#ffd23f',life:60,vy:-0.7});
}
function spawnParticles(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,r:1+Math.random()*3,col:col||'#ff9f1c'});
  }
}
function explosion(x,y,big){
  spawnParticles(x,y, big?40:16, '#ff9f1c');
  spawnParticles(x,y, big?20:8, '#ffd23f');
  parts.push({x,y,vx:0,vy:0,life:24,ring:true,r:6,col:'#fff'});
  if(big) parts.push({x,y,vx:0,vy:0,life:34,ring:true,r:6,col:'#ff5e7a'});
}

// ---------- SPAWNING ----------
function spawnEnemy(){
  const c=levelConfig(level);
  const y=40+Math.random()*(LOGIC_H-80);
  const type=Math.random()<0.25?'diver':'straight';
  enemies.push({
    x:LOGIC_W+40, y, w:40, h:26,
    vx:-(c.enemySpeed*(type==='diver'?1.25:1)),
    vy: type==='diver'?(Math.random()<0.5?-1.4:1.4):0,
    hp:1+Math.floor(level/3), type, fireCd:60+Math.random()*80,
    col: type==='diver'?'#ff5e7a':'#9b6cff'
  });
}
function spawnBoss(){
  const c=levelConfig(level);
  boss={x:LOGIC_W+120, y:LOGIC_H/2, w:150, h:110, vx:-1.0, vy:1.2,
        hp:c.bossHP, maxhp:c.bossHP, fireCd:50, col:'#ff2a4d', entering:true, t:0};
}
function maybeSpawnPickup(x,y){
  if(Math.random()<0.4){
    const kind=Math.random()<0.5?'spread':'shield';
    pickups.push({x,y,w:26,h:26,vy:0.6,kind,t:0});
  }
}

// ---------- INPUT ----------
function stagePos(e){
  const rect=stage.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  return {x:cx/rect.width*LOGIC_W, y:cy/rect.height*LOGIC_H};
}
stage.addEventListener('mousemove',e=>{ const p=stagePos(e); pointer.x=p.x; pointer.y=p.y; });
stage.addEventListener('touchmove',e=>{ e.preventDefault(); const p=stagePos(e); pointer.x=p.x; pointer.y=p.y; },{passive:false});
stage.addEventListener('touchstart',e=>{ e.preventDefault(); const p=stagePos(e); pointer.x=p.x; pointer.y=p.y; },{passive:false});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')inputKey.up=true;
  if(e.key==='ArrowDown')inputKey.down=true;
  if(e.key==='ArrowLeft')inputKey.left=true;
  if(e.key==='ArrowRight')inputKey.right=true;
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp')inputKey.up=false;
  if(e.key==='ArrowDown')inputKey.down=false;
  if(e.key==='ArrowLeft')inputKey.left=false;
  if(e.key==='ArrowRight')inputKey.right=false;
});

// ---------- COMBAT ----------
function playerFire(){
  if(player.fireCd>0) return;
  player.fireCd=10;
  sFire();
  const bx=player.x+player.w/2, by=player.y;
  if(player.spread>0){
    bullets.push({x:bx,y:by,vx:11,vy:0,trail:true});
    bullets.push({x:bx,y:by,vx:10,vy:-3,trail:true});
    bullets.push({x:bx,y:by,vx:10,vy:3,trail:true});
  } else {
    bullets.push({x:bx,y:by,vx:12,vy:0,trail:true});
  }
}
function enemyFire(e){
  const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
  ebullets.push({x:e.x,y:e.y,vx:dx/d*-4,vy:dy/d*-4,r:5});
  tone(300,0.1,'sawtooth',0.06,180);
}
function bossFire(){
  for(let i=0;i<8;i++){
    const a=Math.PI*(0.6+0.8*(i/7));
    ebullets.push({x:boss.x-boss.w/2,y:boss.y,vx:Math.cos(a)*-3.2,vy:Math.sin(a)*3.2,r:6,col:'#ff5e7a'});
  }
  tone(200,0.2,'sawtooth',0.1,120);
}

// ---------- LOOP ----------
function loop(){
  if(!running) return;
  update();
  render();
  requestAnimationFrame(loop);
}
function update(){
  // input -> player
  let tx=player.x, ty=player.y;
  if(inputKey.up||inputKey.down||inputKey.left||inputKey.right){
    const sp=4.5;
    if(inputKey.up) player.y-=sp;
    if(inputKey.down) player.y+=sp;
    if(inputKey.left) player.x-=sp;
    if(inputKey.right) player.x+=sp;
  } else {
    player.y += (pointer.y-player.y)*0.18;
    player.x += (pointer.x-player.x)*0.12;
  }
  player.x=Math.max(20,Math.min(LOGIC_W*0.5,player.x));
  player.y=Math.max(24,Math.min(LOGIC_H-24,player.y));
  // trail
  player.trail.unshift({x:player.x-player.w/2,y:player.y});
  if(player.trail.length>10) player.trail.pop();
  if(invuln>0) invuln--;
  if(shake>0) shake*=0.85;
  if(player.spreadT>0){ player.spreadT--; if(player.spreadT<=0) player.spread=0; }
  if(player.shieldT>0){ player.shieldT--; if(player.shieldT<=0) player.shield=0; }
  if(player.fireCd>0) player.fireCd--;
  playerFire();

  // scroll
  scrollFar=(scrollFar+0.3)%LOGIC_W;
  scrollMid=(scrollMid+0.9)%LOGIC_W;
  scrollNear=(scrollNear+2.0)%LOGIC_W;

  // spawn
  const c=levelConfig(level);
  if(!c.isBoss){
    spawnTimer--;
    if(spawnTimer<=0 && killed<killQuota){
      spawnEnemy();
      spawnTimer=c.spawnInterval;
    }
  } else if(!boss && killed<killQuota){
    spawnBoss();
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx; b.y+=b.vy;
    if(b.x>LOGIC_W+20) bullets.splice(i,1);
  }
  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.x+=e.vx; e.y+=e.vy;
    if(e.y<24||e.y>LOGIC_H-24) e.vy*=-1;
    e.fireCd--;
    if(e.fireCd<=0 && e.x<LOGIC_W-40){ enemyFire(e); e.fireCd=90+Math.random()*90; }
    if(e.x< -60){ enemies.splice(i,1); continue; }
    // hit by player bullet
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.abs(b.x-e.x)<e.w/2+b.w/2*0 && Math.abs(b.x-e.x)<e.w/2 && Math.abs(b.y-e.y)<e.h/2){
        e.hp--; bullets.splice(j,1);
        spawnParticles(b.x,b.y,3,'#ffd23f');
        if(e.hp<=0){
          explosion(e.x,e.y,false); sBoom();
          score+=10*level; killed++; addFloat(e.x,e.y,'+'+(10*level),'#ffd23f');
          maybeSpawnPickup(e.x,e.y);
          enemies.splice(i,1); updateHUD();
        }
        break;
      }
    }
    // hit player
    if(collide(e,player) && invuln<=0){ enemyHitsPlayer(); }
  }

  // boss
  if(boss){
    boss.t++;
    if(boss.entering){
      boss.x-=1.4; if(boss.x<=LOGIC_W-160){ boss.x=LOGIC_W-160; boss.entering=false; }
    } else {
      boss.y+=boss.vy;
      if(boss.y<70||boss.y>LOGIC_H-70) boss.vy*=-1;
    }
    boss.fireCd--;
    if(boss.fireCd<=0){ bossFire(); boss.fireCd=70; }
    // hit by bullet
    for(let j=bullets.length-1;j>=0;j--){
      const b=bullets[j];
      if(Math.abs(b.x-boss.x)<boss.w/2 && Math.abs(b.y-boss.y)<boss.h/2){
        boss.hp--; bullets.splice(j,1); spawnParticles(b.x,b.y,2,'#fff');
        if(boss.hp<=0){
          explosion(boss.x,boss.y,true); sBoom(); shake=14;
          score+=200*level; killed++; addFloat(boss.x,boss.y,'+'+(200*level),'#ffd23f');
          boss=null; updateHUD(); maybeSpawnPickup(LOGIC_W/2,LOGIC_H/2);
        }
      }
    }
    if(boss && collideBox(boss,player) && invuln<=0) enemyHitsPlayer();
  }

  // ebullets
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i]; b.x+=b.vx; b.y+=b.vy;
    if(b.x<-20||b.x>LOGIC_W+20||b.y<-20||b.y>LOGIC_H+20){ ebullets.splice(i,1); continue; }
    if(invuln<=0 && Math.hypot(b.x-player.x,b.y-player.y)<16){
      ebullets.splice(i,1); enemyHitsPlayer();
    }
  }

  // pickups
  for(let i=pickups.length-1;i>=0;i--){
    const p=pickups[i]; p.y+=p.vy; p.t+=0.08;
    if(p.y>LOGIC_H+30){ pickups.splice(i,1); continue; }
    if(Math.hypot(p.x-player.x,p.y-player.y)<28){
      pickups.splice(i,1); sPick();
      if(p.kind==='spread'){ player.spread=1; player.spreadT=600; addFloat(player.x,player.y-30,'POWER UP','#7CFC00'); }
      else { player.shield=1; player.shieldT=600; addFloat(player.x,player.y-30,'SHIELD','#5bc8ff'); }
    }
  }

  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.ring){ p.life--; if(p.life<=0) parts.splice(i,1); continue; }
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.vx*=0.97; p.life--;
    if(p.life<=0) parts.splice(i,1);
  }
  // floats
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.y+=f.vy; f.life--; if(f.life<=0) floats.splice(i,1);
  }

  // level complete
  if(killed>=killQuota){
    level++; killed=0; const nc=levelConfig(level); killQuota=nc.quota;
    lvlBanner=120; sLevel(); addFloat(LOGIC_W/2,LOGIC_H/2,'LEVEL '+level,'#ffd23f'); updateHUD();
    if(nc.isBoss){ /* boss spawns via update */ } else { spawnTimer=40; }
  }
  if(lvlBanner>0) lvlBanner--;
}
function collide(e,p){
  return Math.abs(e.x-p.x)<e.w/2+22 && Math.abs(e.y-p.y)<e.h/2+18;
}
function collideBox(b,p){
  return Math.abs(b.x-p.x)<b.w/2+22 && Math.abs(b.y-p.y)<b.h/2+18;
}
function enemyHitsPlayer(){
  if(player.shield>0){
    player.shield=0; player.shieldT=0; invuln=40; shake=8;
    addFloat(player.x,player.y-30,'BLOCKED','#5bc8ff'); sHit(); return;
  }
  lives--; invuln=90; shake=16; sHit();
  explosion(player.x,player.y,false);
  updateHUD();
  if(lives<=0) gameOver();
}
function gameOver(){
  running=false;
  elOvTitle.textContent='Game Over';
  elOvText.textContent='Score '+score+'　·　Reached Level '+level;
  document.getElementById('startBtn').textContent='Play Again';
  elOverlay.classList.add('show');
}

// ---------- RENDER ----------
function render(){
  ctx.save();
  ctx.setTransform(scale,0,0,scale,0,0);
  let sx=0, sy=0;
  if(shake>0.5){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; }
  ctx.clearRect(0,0,LOGIC_W,LOGIC_H);
  ctx.translate(sx,sy);

  drawBackground();
  drawPickups();
  drawPlayer();
  drawEnemies();
  if(boss) drawBoss();
  drawBullets();
  drawEBullets();
  drawParticles();
  drawFloats();
  drawHUDOverlay();
  ctx.restore();
}
function drawBackground(){
  // sky gradient
  const g=ctx.createLinearGradient(0,0,0,LOGIC_H);
  g.addColorStop(0,'#243b6b'); g.addColorStop(1,'#10162b');
  ctx.fillStyle=g; ctx.fillRect(-20,-20,LOGIC_W+40,LOGIC_H+40);

  // far hills
  ctx.fillStyle='rgba(40,60,110,0.6)';
  for(let x=-((scrollFar)%200); x<LOGIC_W+200; x+=200){
    ctx.beginPath(); ctx.moveTo(x,LOGIC_H);
    ctx.quadraticCurveTo(x+100,LOGIC_H-120,x+200,LOGIC_H); ctx.fill();
  }
  // mid hills
  ctx.fillStyle='rgba(30,45,85,0.85)';
  for(let x=-((scrollMid)%160); x<LOGIC_W+160; x+=160){
    ctx.beginPath(); ctx.moveTo(x,LOGIC_H);
    ctx.quadraticCurveTo(x+80,LOGIC_H-70,x+160,LOGIC_H); ctx.fill();
  }
  // clouds
  ctx.fillStyle='rgba(255,255,255,0.12)';
  for(let i=0;i<6;i++){
    let cx=((i*180 - scrollNear)%(LOGIC_W+200)+LOGIC_W+200)%(LOGIC_W+200)-100;
    let cy=40+i*70;
    cloud(cx,cy,38);
  }
  // ground strip
  ctx.fillStyle='rgba(10,16,32,0.9)'; ctx.fillRect(-20,LOGIC_H-22,LOGIC_W+40,42);
}
function cloud(x,y,r){
  ctx.beginPath();
  ctx.arc(x,y,r,0,7); ctx.arc(x+r,y+6,r*0.8,0,7);
  ctx.arc(x-r,y+8,r*0.7,0,7); ctx.fill();
}
function drawPlayer(){
  if(invuln>0 && Math.floor(invuln/4)%2===0) return; // blink
  const p=player;
  // engine trail
  for(let i=0;i<p.trail.length;i++){
    const t=p.trail[i], a=(1-i/p.trail.length)*0.5;
    ctx.fillStyle='rgba(120,200,255,'+a+')';
    ctx.beginPath(); ctx.arc(t.x,t.y, 4+ (i/p.trail.length)*4,0,7); ctx.fill();
  }
  // shield
  if(p.shield>0){
    ctx.strokeStyle='rgba(91,200,255,0.8)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,30,0,7); ctx.stroke();
  }
  ctx.save(); ctx.translate(p.x,p.y);
  // body
  ctx.fillStyle='#5bc8ff';
  ctx.beginPath();
  ctx.moveTo(24,0); ctx.lineTo(-18,-14); ctx.lineTo(-10,0); ctx.lineTo(-18,14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3a92d6';
  ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-18,-14); ctx.lineTo(-14,0); ctx.lineTo(-18,14); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(-2,0,5,0,7); ctx.fill();
  ctx.restore();
}
function drawEnemies(){
  for(const e of enemies){
    ctx.save(); ctx.translate(e.x,e.y);
    ctx.fillStyle=e.col;
    ctx.beginPath();
    ctx.moveTo(-20,0); ctx.lineTo(18,-13); ctx.lineTo(10,0); ctx.lineTo(18,13); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(2,0,4,0,7); ctx.fill();
    ctx.restore();
  }
}
function drawBoss(){
  ctx.save(); ctx.translate(boss.x,boss.y);
  ctx.fillStyle=boss.col;
  ctx.beginPath();
  ctx.moveTo(-70,0); ctx.lineTo(50,-50); ctx.lineTo(70,0); ctx.lineTo(50,50); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7a0014';
  ctx.beginPath(); ctx.moveTo(30,-30); ctx.lineTo(70,0); ctx.lineTo(30,30); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(-20,0,12,0,7); ctx.fill();
  ctx.restore();
  // hp bar
  const w=LOGIC_W-40, x=20, y=14;
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(x,y,w,10);
  ctx.fillStyle='#ff2a4d'; ctx.fillRect(x,y,w*(boss.hp/boss.maxhp),10);
  ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.strokeRect(x,y,w,10);
}
function drawBullets(){
  for(const b of bullets){
    ctx.strokeStyle='rgba(255,220,90,0.9)'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-14,b.y-b.vy*1.2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,3,0,7); ctx.fill();
  }
}
function drawEBullets(){
  for(const b of ebullets){
    ctx.fillStyle=b.col||'#ff5e7a';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r||5,0,7); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(b.x,b.y,(b.r||5)*0.5,0,7); ctx.fill();
  }
}
function drawPickups(){
  for(const p of pickups){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.t);
    if(p.kind==='spread'){ ctx.fillStyle='#7CFC00'; ctx.fillRect(-12,-4,24,8); ctx.fillRect(-4,-12,8,24); }
    else { ctx.strokeStyle='#5bc8ff'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.stroke();
           ctx.fillStyle='#5bc8ff'; ctx.fillRect(-3,-9,6,18); }
    ctx.restore();
  }
}
function drawParticles(){
  for(const p of parts){
    if(p.ring){
      const rr=p.r+(24-p.life)*1.6;
      ctx.strokeStyle=p.col; ctx.globalAlpha=p.life/24; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,7); ctx.stroke(); ctx.globalAlpha=1; continue;
    }
    ctx.fillStyle=p.col; ctx.globalAlpha=Math.max(0,p.life/40);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1;
  }
}
function drawFloats(){
  ctx.textAlign='center'; ctx.font='900 20px sans-serif';
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life/30);
    ctx.fillStyle=f.color;
    ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1; ctx.textAlign='left';
}
function drawHUDOverlay(){
  if(lvlBanner>0){
    const a=Math.min(1,lvlBanner/30);
    ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.fillStyle='#ffd23f'; ctx.font='900 56px sans-serif';
    ctx.fillText('LEVEL '+level, LOGIC_W/2, LOGIC_H/2);
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
}

// ---------- START ----------
document.getElementById('startBtn').addEventListener('click',()=>{
  initAudio();
  if(AC && AC.state==='suspended') AC.resume();
  elOverlay.classList.remove('show');
  resetGame();
  resize();
  running=true;
  loop();
});

resize(); draw();
})();
</script>
</body>
</html>
