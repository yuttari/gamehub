<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Minesweeper</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:radial-gradient(circle at 50% -10%,#dbeafe,#fbfafc);color:#2c2733;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden;}
  .wrap{width:100%;max-width:420px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  h1{font-size:22px;font-weight:900;}
  .pill{background:#fff;box-shadow:0 4px 14px -6px rgba(0,0,0,.2);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;}
  .board{display:grid;gap:4px;background:#fff;padding:8px;border-radius:16px;box-shadow:0 10px 30px -12px rgba(0,0,0,.25);touch-action:manipulation;}
  .cell{aspect-ratio:1;border-radius:8px;border:none;background:#cbd5e1;font-weight:900;font-size:clamp(12px,4vw,18px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;}
  .cell.o{background:#f1f5f9;cursor:default;}
  .cell.f{background:#ffd23f;}
  .cell.b{background:#ff4d12;color:#fff;}
  .n1{color:#2563eb}.n2{color:#16a34a}.n3{color:#dc2626}.n4{color:#7c3aed}.n5{color:#b45309}.n6{color:#0891b2}.n7{color:#334155}.n8{color:#64748b}
  .overlay{position:fixed;inset:0;background:rgba(251,250,252,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .25s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .overlay h2{font-size:30px;font-weight:900;}
  .btn{background:#ed3703;color:#fff;border:none;border-radius:12px;padding:12px 26px;font-weight:800;font-size:16px;cursor:pointer;}
  .hint{margin-top:12px;text-align:center;font-size:12px;color:#64748b;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>💣 Minesweeper</h1><div class="pill">💡 <b id="mine">0</b>　⏱ <b id="time">0</b></div></div>
  <div class="board" id="board"></div>
  <p class="hint">Tap a tile to reveal it and avoid the mines. Long-press / right-click to flag. Clear all safe tiles to win!</p>
</div>
<div class="overlay" id="ov"><h2 id="ovt"></h2><p id="ovp"></p><button class="btn" id="st">Play Again</button></div>

<script>
(function(){
  const board=document.getElementById('board'),mineEl=document.getElementById('mine'),timeEl=document.getElementById('time'),ov=document.getElementById('ov'),ovt=document.getElementById('ovt'),ovp=document.getElementById('ovp'),st=document.getElementById('st');
  const N=10,M=12;
  let grid,revealed,flagged,gameover,won,timer,t=0,flags;
  function build(){
    board.style.gridTemplateColumns=`repeat(${N},1fr)`;
    grid=Array.from({length:N},()=>Array(M).fill(0));
    revealed=Array.from({length:N},()=>Array(M).fill(false));
    flagged=Array.from({length:N},()=>Array(M).fill(false));
    gameover=false;won=false;t=0;flags=0;timeEl.textContent=0;
    // place mines
    let placed=0;
    while(placed<12){const i=Math.random()*N|0,j=Math.random()*M|0;if(!grid[i][j]){grid[i][j]=-1;placed++;}}
    for(let i=0;i<N;i++)for(let j=0;j<M;j++){if(grid[i][j]===-1)continue;let c=0;for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const ni=i+di,nj=j+dj;if(ni>=0&&ni<N&&nj>=0&&nj<M&&grid[ni][nj]===-1)c++;}grid[i][j]=c;}
    mineEl.textContent=12;
    board.innerHTML='';
    for(let i=0;i<N;i++)for(let j=0;j<M;j++){const b=document.createElement('button');b.className='cell';b.dataset.i=i;b.dataset.j=j;b.onclick=()=>reveal(i,j);b.oncontextmenu=e=>{e.preventDefault();toggleFlag(i,j);};board.appendChild(b);}
  }
  function reveal(i,j){if(gameover||revealed[i][j]||flagged[i][j])return;revealed[i][j]=true;const b=board.children[i*M+j];if(grid[i][j]===-1){b.classList.add('b');b.textContent='💣';return lose();}if(grid[i][j]===0){b.classList.add('o');b.textContent='';flood(i,j);}else{b.classList.add('o');b.textContent=grid[i][j];b.classList.add('n'+grid[i][j]);}checkWin();}
  function flood(i,j){for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){const ni=i+di,nj=j+dj;if(ni>=0&&ni<N&&nj>=0&&nj<M&&!revealed[ni][nj]&&grid[ni][nj]!==-1){reveal(ni,nj);}}}
  function toggleFlag(i,j){if(gameover||revealed[i][j])return;const b=board.children[i*M+j];if(flagged[i][j]){flagged[i][j]=false;b.classList.remove('f');b.textContent='';flags--;}else{flagged[i][j]=true;b.classList.add('f');b.textContent='🚩';flags++;}mineEl.textContent=12-flags;}
  function checkWin(){let ok=true;for(let i=0;i<N;i++)for(let j=0;j<M;j++){if(grid[i][j]!==-1&&!revealed[i][j])ok=false;}if(ok){win();}}
  function lose(){gameover=true;clearInterval(timer);for(let i=0;i<N;i++)for(let j=0;j<M;j++){if(grid[i][j]===-1){const b=board.children[i*M+j];if(!revealed[i][j]&&!flagged[i][j]){b.classList.add('b');b.textContent='💣';}}}ovt.textContent='💥 Boom!';ovp.textContent='Time: '+t+' s';st.textContent='Play Again';ov.classList.add('show');}
  function win(){gameover=true;clearInterval(timer);ovt.textContent='🎉 You Win!';ovp.textContent='Time: '+t+' s';st.textContent='Play Again';ov.classList.add('show');}
  function start(){build();ov.classList.remove('show');clearInterval(timer);timer=setInterval(()=>{if(!gameover){t++;timeEl.textContent=t;}},1000);}
  st.onclick=start;start();
})();
</script>
</body>
</html>
