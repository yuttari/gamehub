<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Thunder Fighter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#04060f; overflow:hidden; font-family:system-ui,sans-serif; }
  #wrap{ position:relative; width:100%; height:100%; }
  canvas{ display:block; width:100%; height:100%; background:linear-gradient(180deg,#0a1430,#04060f); touch-action:none; }
  #hud{ position:absolute; top:12px; right:14px; color:#fff; font-weight:800; font-size:15px; text-shadow:0 2px 6px rgba(0,0,0,.6); pointer-events:none; }
  #hud small{ display:block; font-weight:600; font-size:11px; opacity:.75; margin-top:2px; text-align:right; }
  #ov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff; background:rgba(4,6,15,.8); backdrop-filter:blur(4px); text-align:center; padding:20px; }
  #ov h1{ font-size:30px; background:linear-gradient(90deg,#7cd3ff,#38bdf8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #ov p{ max-width:460px; line-height:1.6; opacity:.85; font-size:14px; }
  .btn{ border:none; cursor:pointer; padding:12px 26px; border-radius:999px; font-weight:800; font-size:16px; color:#04101f; background:linear-gradient(90deg,#7cd3ff,#38bdf8); box-shadow:0 10px 30px -10px rgba(56,189,248,.7); }
  .btn:active{ transform:scale(.96); }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">Score <span id="sc">0</span><small>Move mouse / drag finger</small></div>
  <div id="ov">
    <h1>Thunder Fighter</h1>
    <p>Pilot your fighter and blast enemy planes! Move the mouse or your finger to steer—bullets fire automatically. See how high you can score.</p>
    <button class="btn" id="start">Launch!</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=960,H=540;
function resize(){ const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=W; cv.height=H; }
resize(); addEventListener('resize',resize);
const ov=document.getElementById('ov'), startBtn=document.getElementById('start'), scEl=document.getElementById('sc');
let running=false, last=0, score=0, stars=[], bullets=[], enemies=[], spawnT=0, shootT=0;
let ship={x:0,y:0,r:18};
function reset(){ ship.x=W/2; ship.y=H-90; score=0; bullets=[]; enemies=[]; spawnT=0; shootT=0;
  stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5})); }
function shoot(){ bullets.push({x:ship.x,y:ship.y-20,v:9}); }
function spawnE(){ const x=30+Math.random()*(W-60); enemies.push({x,y:-30,v:1+Math.random()*1.8,hp:1,r:16,col:'#ff6b6b',t:Math.random()*6}); }
function loop(t){
  if(!running){ requestAnimationFrame(loop); return; }
  const dt=1; last=t;
  // stars
  for(const s of stars){ s.y+=s.s*1.2; if(s.y>H){ s.y=0; s.x=Math.random()*W; } }
  // shoot auto
  shootT++; if(shootT>7){ shoot(); shootT=0; }
  for(const b of bullets) b.y-=b.v;
  bullets=bullets.filter(b=>b.y>-20);
  spawnT++; if(spawnT>45){ spawnE(); spawnT=0; }
  for(const e of enemies){ e.y+=e.v*1.4; e.x+=Math.sin((t/300)+e.t)*1.2; }
  // hit
  for(const e of enemies){ for(const b of bullets){ if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){ e.hp--; b.y=-999; } } }
  enemies=enemies.filter(e=>e.hp>0 && e.y<H+40);
  for(const e of enemies){ if(Math.hypot(e.x-ship.x,e.y-ship.y)<e.r+ship.r){ gameOver(); return; } }
  score+=0.2; scEl.textContent=Math.floor(score);
  draw();
  requestAnimationFrame(loop);
}
function draw(){
  ctx.fillStyle='rgba(4,6,15,0.35)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#9fd0ff'; for(const s of stars){ ctx.globalAlpha=0.5; ctx.fillRect(s.x,s.y,s.s,s.s); } ctx.globalAlpha=1;
  // bullets
  ctx.fillStyle='#fde047'; for(const b of bullets){ ctx.fillRect(b.x-2,b.y-8,4,12); }
  // enemies
  for(const e of enemies){ ctx.fillStyle=e.col; ctx.beginPath(); ctx.moveTo(e.x,e.y-e.r); ctx.lineTo(e.x+e.r,e.y+e.r); ctx.lineTo(e.x-e.r,e.y+e.r); ctx.fill(); }
  // ship
  ctx.save(); ctx.translate(ship.x,ship.y);
  ctx.fillStyle='#7cd3ff'; ctx.beginPath(); ctx.moveTo(0,-ship.r-4); ctx.lineTo(ship.r,ship.r); ctx.lineTo(0,ship.r-6); ctx.lineTo(-ship.r,ship.r); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillRect(-3,ship.r-2,6,8); ctx.restore();
}
function move(e){ const r=cv.getBoundingClientRect(); const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const py=(e.touches?e.touches[0].clientY:e.clientY)-r.top; ship.x=Math.max(ship.r,Math.min(W-ship.r,px)); ship.y=Math.max(ship.r,Math.min(H-ship.r,py)); }
cv.addEventListener('mousemove',move); cv.addEventListener('touchmove',e=>{ move(e); e.preventDefault(); },{passive:false});
function gameOver(){ running=false; ov.classList.remove('hidden'); ov.querySelector('h1').textContent='Shot Down!'; ov.querySelector('p').innerHTML='Final Score <b>'+Math.floor(score)+'</b>'; startBtn.textContent='Play Again'; }
startBtn.addEventListener('click',()=>{ reset(); ov.classList.add('hidden'); running=true; requestAnimationFrame(loop); });
</script>
</body>
</html>
